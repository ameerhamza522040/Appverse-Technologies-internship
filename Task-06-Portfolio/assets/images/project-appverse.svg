    <circle cx="18" cy="15" r="4" fill="#CFCBBD"/>
    <circle cx="32" cy="15" r="4" fill="#CFCBBD"/>
    <circle cx="46" cy="15" r="4" fill="#CFCBBD"/>
    <rect x="70" y="9" width="140" height="12" rx="6" fill="#E3E0D6"/>

