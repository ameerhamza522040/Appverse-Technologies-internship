  <rect width="400" height="300" fill="#F1EEE7"/>
  <rect x="0" y="0" width="400" height="300" fill="none" stroke="#E3E0D6" stroke-width="1"/>

  <!-- browser chrome -->
  <g transform="translate(52,54)">
    <rect x="0" y="0" width="296" height="192" rx="8" fill="#FFFFFF" stroke="#CFCBBD"/>
